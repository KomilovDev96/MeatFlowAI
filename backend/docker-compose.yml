services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: meatflow
      POSTGRES_USER: meatflow
      POSTGRES_PASSWORD: meatflow
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meatflow -d meatflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6385:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible storage (RustFS); service name kept as "minio" for the backend's env vars.
  minio:
    image: rustfs/rustfs:1.0.6
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
      # the browser uploads straight to storage via presigned URLs, so it needs CORS
      RUSTFS_CORS_ALLOWED_ORIGINS: "*"
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - storage_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  storage_data:
