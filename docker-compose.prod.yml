services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meatflow}
      POSTGRES_USER: ${POSTGRES_USER:-meatflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meatflow} -d ${POSTGRES_DB:-meatflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage. The service keeps the name "minio" (the backend talks to
  # MINIO_ENDPOINT=minio through the minio client library), but the image is RustFS because
  # minio/minio is no longer pullable from Docker Hub / quay.io.
  minio:
    image: rustfs/rustfs:1.0.6
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ROOT_USER}
      RUSTFS_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      # the browser uploads straight to storage via presigned URLs (signature is required
      # for writes; the bucket is public-read only), so CORS must allow it
      RUSTFS_CORS_ALLOWED_ORIGINS: "*"
    # published so browsers can reach the presigned upload/download URLs (see STORAGE_PUBLIC_URL)
    ports:
      - "9000:9000"
    volumes:
      - storage_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/komilovdev96/meatflowai-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "3000:3000"

  frontend:
    image: ghcr.io/komilovdev96/meatflowai-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  postgres_data:
  redis_data:
  storage_data:
